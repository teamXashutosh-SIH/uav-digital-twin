services:

  mqtt:
    image: eclipse-mosquitto:2
    container_name: aerotwin-mqtt
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log


  postgres:
    image: postgres:16
    container_name: aerotwin-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: aerotwin
      POSTGRES_USER: aerotwin
      POSTGRES_PASSWORD: aerotwin_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  mqtt_data:
  mqtt_log:
  postgres_data: